# MeterZone на Synology DSM / любом Linux с Docker.
#
# Ничего не собирается и никакие папки создавать не нужно:
# образ скачивается с GitHub, том данных Docker создаёт сам.

services:
  meterzone:
    image: ghcr.io/ognis163/meterzone-dist:latest
    restart: unless-stopped

    ports:
      - "8099:8099"

    environment:
      # Часовой пояс — замените на свой, если он другой.
      TZ: Europe/Astrakhan
      APP_TZ: Europe/Astrakhan

      HOST: 0.0.0.0
      PORT: "8099"

      APP_DB: /data/meterzone.db
      APP_BACKUP_DIR: /data/backups

      # Порт задаётся здесь, а не из интерфейса приложения.
      PORT_FIXED: "1"

      # Раскомментируйте для доступа не только из локальной сети.
      # ALLOW_PUBLIC: "1"

    # Именованный том: Docker создаёт его сам, папку руками готовить не нужно.
    # Если файлы нужны в File Station — см. README, раздел «Папка вместо тома».
    volumes:
      - meterzone-data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  meterzone-data:
