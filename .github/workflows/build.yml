name: build

# Собирает MeterZone из исходников (репозиторий ognis163/MeterZone) и публикует:
#   - образ для Docker: ghcr.io/ognis163/meterzone-dist:latest (amd64 + arm64)
#   - бинарники в Releases: meterzone-linux-arm64, meterzone-linux-amd64
#
# Локально на NAS ничего не компилируется: Container Manager только скачивает образ.

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

env:
  SRC_REPO: ognis163/MeterZone
  IMAGE: ghcr.io/ognis163/meterzone-dist

jobs:
  binaries:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Исходники MeterZone
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SRC_REPO }}
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: src/go.sum

      - name: Версия приложения
        id: ver
        run: |
          V=$(sed -n 's/^const version = "\(.*\)"$/\1/p' src/main.go | head -n1)
          echo "Версия: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Сборка бинарников
        working-directory: src
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          set -eux
          GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../meterzone-linux-arm64 .
          GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../meterzone-linux-amd64 .
          cd ..
          ls -lh meterzone-linux-*
          file meterzone-linux-arm64 meterzone-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: meterzone-linux-*
          retention-days: 30

  image:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.binaries.outputs.version }}

  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Публикация бинарников
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.binaries.outputs.version }}
          name: MeterZone ${{ needs.binaries.outputs.version }}
          make_latest: true
          body: |
            Готовые сборки MeterZone ${{ needs.binaries.outputs.version }}.

            | Файл | Для чего |
            |---|---|
            | `meterzone-linux-arm64` | Keenetic Hopper, Synology с arm64 |
            | `meterzone-linux-amd64` | обычный Linux x86_64 |

            Docker: `ghcr.io/ognis163/meterzone-dist:latest`
          files: |
            dist/meterzone-linux-arm64
            dist/meterzone-linux-amd64
            install-keenetic.sh
